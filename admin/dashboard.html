<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b1d16">
  <title>Dashboard | ShopNest Admin</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-layout="admin" data-guard="admin" data-page="dashboard" data-root="../" data-title="Dashboard">
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="admin-layout">
    <!-- Sidebar and top bar are filled by js/layout.js -->
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main id="main" class="admin-content page-main">
        <div class="page-intro">
          <div>
            <h2 class="page-intro__title">Welcome back</h2>
            <p class="page-intro__text">Here is how ShopNest is doing today.</p>
          </div>
        </div>

        <!-- Stat cards: live numbers arrive in Phase 6 -->
        <section class="stat-grid" aria-label="Key numbers">
          <article class="stat-card tone-1">
            <span class="stat-card__icon"><span data-icon="box" data-size="22"></span></span>
            <p class="stat-card__label">Total products</p>
            <p class="stat-card__value"><span class="skeleton"></span></p>
          </article>
          <article class="stat-card tone-5">
            <span class="stat-card__icon"><span data-icon="alert" data-size="22"></span></span>
            <p class="stat-card__label">Low-stock items</p>
            <p class="stat-card__value"><span class="skeleton"></span></p>
          </article>
          <article class="stat-card tone-9">
            <span class="stat-card__icon"><span data-icon="users" data-size="22"></span></span>
            <p class="stat-card__label">Customers</p>
            <p class="stat-card__value"><span class="skeleton"></span></p>
          </article>
          <article class="stat-card tone-6">
            <span class="stat-card__icon"><span data-icon="wallet" data-size="22"></span></span>
            <p class="stat-card__label">Total sales</p>
            <p class="stat-card__value"><span class="skeleton"></span></p>
          </article>
        </section>

        <section class="panel" aria-labelledby="dashboard-next">
          <div class="panel-head">
            <h3 class="panel-title" id="dashboard-next">Admin shell ready</h3>
            <span class="badge badge-info">Phase 0</span>
          </div>
          <div class="panel-body">
            <div class="empty-state">
              <div class="empty-state__art"><span data-icon="chart" data-size="40"></span></div>
              <p class="empty-state__title">Live numbers are on the way</p>
              <p class="empty-state__text">Inventory (Phase 2), Customers (Phase 3) and Reports (Phase 6) plug into this layout.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/jquery-fallback.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
</body>
</html>
