<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b1d16">
  <title>Reports | ShopNest Admin</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-layout="admin" data-guard="admin" data-page="reports" data-root="../" data-title="Reports">
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main id="main" class="admin-content page-main">
        <div class="page-intro">
          <div>
            <h2 class="page-intro__title">Reports</h2>
            <p class="page-intro__text">Customers, inventory and sales. Pick a report, choose the dates, and download it if you need it.</p>
          </div>
        </div>

        <!-- Three groups of reports (tabs). Arrow keys move between them. -->
        <div class="report-tabs" role="tablist" aria-label="Report groups" id="report-tabs">
          <button type="button" class="report-tab" role="tab" id="tab-customers" data-group="customers" aria-selected="true" aria-controls="report-panel">
            <span data-icon="users" data-size="18"></span> Customers
          </button>
          <button type="button" class="report-tab" role="tab" id="tab-inventory" data-group="inventory" aria-selected="false" aria-controls="report-panel" tabindex="-1">
            <span data-icon="box" data-size="18"></span> Inventory
          </button>
          <button type="button" class="report-tab" role="tab" id="tab-sales" data-group="sales" aria-selected="false" aria-controls="report-panel" tabindex="-1">
            <span data-icon="chart" data-size="18"></span> Sales
          </button>
        </div>

        <section class="panel report-panel" id="report-panel" role="tabpanel" aria-labelledby="tab-customers">
          <!-- Which report of this group (built by js/admin-reports.js) -->
          <div class="panel-head">
            <div class="chip-row" id="report-types" role="group" aria-label="Choose a report"></div>
            <button type="button" class="btn btn-secondary btn-sm" id="download-csv" disabled>
              <span data-icon="receipt" data-size="16"></span> Download CSV
            </button>
          </div>

          <form class="report-filters" id="report-filters" novalidate>
            <!-- From / To dates (hidden for reports that always show today's data) -->
            <div class="report-filters__dates" id="date-filters">
              <div class="field">
                <label class="field-label" for="rf-from">From date</label>
                <input class="input" id="rf-from" type="date" required aria-describedby="rf-from-error">
                <p class="field-error" id="rf-from-error"></p>
              </div>
              <div class="field">
                <label class="field-label" for="rf-to">To date</label>
                <input class="input" id="rf-to" type="date" required aria-describedby="rf-to-error">
                <p class="field-error" id="rf-to-error"></p>
              </div>
              <div class="chip-row report-presets" role="group" aria-label="Quick date ranges">
                <button type="button" class="chip" data-preset="today">Today</button>
                <button type="button" class="chip" data-preset="7d">Last 7 days</button>
                <button type="button" class="chip" data-preset="30d">Last 30 days</button>
                <button type="button" class="chip" data-preset="month">This month</button>
                <button type="button" class="chip" data-preset="all">All time</button>
              </div>
            </div>

            <div class="field" id="category-filter" hidden>
              <label class="field-label" for="rf-category">Category</label>
              <select class="input" id="rf-category"><option value="">All categories</option></select>
            </div>
          </form>

          <div class="panel-body report-output" id="report-output" aria-live="polite" aria-busy="true"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/jquery-fallback.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/reports-calc.js"></script>
  <script src="../js/admin-reports.js"></script>
</body>
</html>
