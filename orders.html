<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fffaf5">
  <title>My orders | ShopNest</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/orders.css">
</head>
<!-- data-guard="customer": signed-out visitors go to sign-in, the admin goes to the dashboard -->
<body data-layout="store" data-guard="customer" data-page="orders">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page-main section">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">Your account</p>
          <h1 class="section-title">My orders</h1>
          <p class="section-sub">Every order you have placed, newest first, each with its bill.</p>
        </div>
      </div>

      <!-- Orders, total spent and credit (filled by js/orders.js) -->
      <section class="mini-stats orders-summary" id="orders-summary" aria-label="Your account summary"></section>

      <div class="orders-toolbar">
        <div class="chip-row" id="order-filters" role="group" aria-label="Filter orders by payment type"></div>
        <p class="orders-toolbar__count" id="order-count-line" aria-live="polite"></p>
      </div>

      <div class="order-list" id="order-list" aria-busy="true"></div>
      <div id="order-pager"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/jquery-fallback.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/placeholder.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product-card.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
