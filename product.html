<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product details at ShopNest.">
  <meta name="theme-color" content="#fffaf5">
  <title>Product | ShopNest</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/product.css">
</head>
<body data-layout="store" data-page="shop">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page-main">
    <div class="container product-page">
      <!-- Filled by js/product.js: breadcrumb, photo, details, related products -->
      <div id="product-root" aria-live="polite" aria-busy="true">
        <div class="product-detail" aria-hidden="true">
          <div class="skeleton product-detail__skeleton-photo"></div>
          <div>
            <div class="skeleton skeleton-line w-40"></div>
            <div class="skeleton skeleton-line w-80 product-detail__skeleton-title"></div>
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-80"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/jquery-fallback.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/placeholder.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product-card.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
